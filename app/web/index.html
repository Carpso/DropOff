<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.
    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="DropOff — send parcels in Zambia without going anywhere. A rider collects from your door and drops it at the courier depot you choose. Track every parcel door-to-door.">
  <meta name="theme-color" content="#123C32">

  <!-- Open Graph / Twitter-style share cards -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="DropOff — We carry it to the courier">
  <meta property="og:description" content="Send parcels in Zambia without going anywhere. A rider collects from your door and drops it at the courier you choose. Track door-to-door.">
  <meta property="og:site_name" content="DropOff Zambia">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="DropOff — We carry it to the courier">
  <meta name="twitter:description" content="Send parcels in Zambia without going anywhere. A rider collects from your door and drops it at the courier you choose.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DropOff">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DropOff — We carry it to the courier</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="dropoff-loader" style="position:fixed; inset:0; background:#123c32; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:18px; transition: opacity 240ms ease; z-index: 9999;">
    <div style="width:56px; height:56px; border:4px solid rgba(255,255,255,0.15); border-top-color:#f6b73c; border-radius:50%; animation: spin 900ms linear infinite;"></div>
    <div id="dropoff-loader-text" style="color:#c9d9d2; font: 700 18px/1.2 system-ui, sans-serif; letter-spacing:2px; text-transform: uppercase;">DropOff</div>
  </div>
  <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(() => {
          document.getElementById('dropoff-loader')?.remove();
        }).catch(() => {
          document.getElementById('dropoff-loader')?.remove();
        });
      });
    } else {
      document.getElementById('dropoff-loader')?.remove();
    }
  </script>
  <script>document.getElementById('dropoff-loader')?.remove();</script>
</body>
</html>
