name: dropoff
description: DropOff - home or shop pickup to your chosen Zambian courier depot.
publish_to: "none"
version: 0.5.0+11

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.1
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  flutter_map: ^8.3.2
  vector_map_tiles_pmtiles: ^1.5.2
  latlong2: ^0.9.1
  vector_map_tiles: ^9.0.0-beta.9
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^20.1.0
  web_socket_channel: ^3.0.3
  local_auth: ^3.0.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  web:
    generate: true
    image_path: "assets/brand/dropoff_logo.png"
    background_color: "#123C32"
    theme_color: "#F6B73C"
  windows:
    generate: true
    image_path: "assets/brand/dropoff_logo.png"
    icon_size: 48
  macos:
    generate: false
  image_path: "assets/brand/dropoff_logo.png"
  adaptive_icon_background: "#123C32"
  adaptive_icon_foreground: "assets/brand/dropoff_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/images/
    - assets/legal/

