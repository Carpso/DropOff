app = "dropoff-router"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[env]
  OSRM_PARAMS = "--algorithm mld"

[[services]]
  internal_port = 5000
  protocol = "tcp"
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[services.http_checks]]
    interval = 30000
    grace_period = "10s"
    method = "GET"
    path = "/route/v1/driving/28.3228,-15.3875;28.2833,-15.4167?overview=false"
    expected_statuses = [200]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 2048

[[mounts]]
  source = "osrm_data"
  destination = "/data"
  initial_size = "1gb"
