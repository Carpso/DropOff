<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120" role="img" aria-label="DropOff logo">
  <defs>
    <style>
      .rider { fill: #0B1F3A; }
      .droplet { fill: #FF6A00; }
      .accent { fill: #FFC400; }
      .word-drop { fill: #FF6A00; }
      .word-off { fill: #0B1F3A; }
      text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -0.5px; }
    </style>
  </defs>

  <!-- ===== Icon: parcel + downward drop arrow / location pin ===== -->
  <g transform="translate(8,8)">
    <!-- location pin outer (subtle, behind parcel) -->
    <path class="droplet" opacity="0.25"
          d="M31 76 C 14 58, 8 46, 8 34 a 23 23 0 0 1 46 0 c 0 12 -6 24 -23 42 z"/>
    <!-- parcel box -->
    <g transform="translate(6,10)">
      <rect x="6" y="4" width="34" height="30" rx="5" class="rider"/>
      <!-- tape line -->
      <rect x="20.5" y="4" width="5" height="30" fill="#FFFFFF" opacity="0.9"/>
      <!-- flap line -->
      <line x1="6" y1="14" x2="40" y2="14" stroke="#FFFFFF" stroke-width="2.4" opacity="0.9"/>
      <!-- knock-out location pin on face -->
      <path class="droplet"
            d="M23 40 a 9.5 9.5 0 0 1 9.5 9.5 c 0 6.5 -9.5 15 -9.5 15 s -9.5 -8.5 -9.5 -15 A 9.5 9.5 0 0 1 23 40 z"/>
      <circle cx="23" cy="50" r="3.4" fill="#FFFFFF"/>
    </g>
    <!-- drop swoosh arrow curving down into the box -->
    <path d="M52 6 C 66 10, 70 22, 62 32 L 54 40"
          fill="none" stroke="#FF6A00" stroke-width="6" stroke-linecap="round"/>
    <path d="M46 32 L 55 50 L 64 31 Z" class="droplet"/>
  </g>

  <!-- ===== Wordmark ===== -->
  <text x="132" y="72"><tspan class="word-drop">Drop</tspan><tspan class="word-off">Off</tspan></text>

  <!-- tagline -->
  <text x="134" y="98" style="font-size:13px; font-weight:600; letter-spacing:2.2px;" class="word-off" opacity="0.75">DROP IT. WE TAKE IT FROM THERE.</text>
</svg>
