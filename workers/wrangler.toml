name = "dropoff-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
account_id = "ab82a97ce2c926279c483fef36c41945"

# Transactional email (password reset / email verification) via Cloudflare
# Email Service. MUST be a top-level binding (an array-of-tables) — putting it
# under [triggers] silently does nothing and every auth email 500s.
# Sender domain must be onboarded: npx wrangler email sending enable <domain>
[[send_email]]
name = "EMAIL"

[triggers]
# daily sweep: bill expiring Silver/Gold/Platinum packs 3 days before expiry,
# export app-data backups to R2 at 02:00 CAT.
# timed-pickup reminders: T-30 / T-10 pushes + missed flags (every minute).
# weekly ops digest: Monday 08:00 CAT (06:00 UTC).
crons = ["0 2 * * *", "* * * * *", "0 19 * * *", "0 14 * * SUN", "0 14 1 * *", "0 6 * * MON"]

[vars]
# Lipila: PRODUCTION https://blz.lipila.io (live key required in LIPILA_API_KEY secret)
# sandbox https://api.lipila.dev — only for test deploys
LIPILA_BASE_URL = "https://blz.lipila.io"
LIPILA_CALLBACK_URL = "https://dropoff-api.godfreymoseskalambo.workers.dev/webhooks/lipila"
# Business momo for ALL platform income (platform fees + processing fees).
# Scheduled sweeps disburse accumulated income to this number. NEVER commit a
# different number here — this is the payout account for the whole platform.
BUSINESS_PHONE = "260976847775"
# Sender for transactional emails — MUST be on a domain onboarded for Email
# Sending in THIS Cloudflare account (the account's only zone is
# carpsosolutions.store; churchonapp.com is not in this account and was
# rejected with "domain was not found").
MAIL_FROM = "no-reply@carpsosolutions.store"
APP_URL = "https://dropoff-api.godfreymoseskalambo.workers.dev"
AUTH_DEV_MODE = "0"                            # "1" = return OTP codes / reset links in responses
# Router upstream: free public OSRM demo (stopgap chosen by owner 2026-11-17 —
# same "borrow a free router" pattern ChurchOnApp used; Worker caches 15 min and
# volume is tiny). Swap to self-hosted (infra/router/README.md) with one change.
ROUTER_UPSTREAM = "https://router.project-osrm.org"
# The Worker proxy uses it ahead of any keyed service; riders get road-following routes; no keys involved.

# SMS — Africa's Talking. DropOff sends on the ChurchOnApp app (from
# 2026-11-18): it is funded (wallet ZMW 49.92) and holds the approved
# alphanumeric sender "Carpso" — DropOff's brand. Kingdom Sponsor sends on the
# SAME app with sender "KSPONSOR": one funded wallet, each app its own sender
# ID (owner directive). The kingdom_sponsor app has NO approved sender, so
# DropOff does not use it. The key is also saved at
# OneDrive/Documents/"Settings - API Key.txt" (owner's copy).
# Secret: AT_API_KEY (npx wrangler secret put AT_API_KEY) — must be the
# ChurchOnApp app's API key (verified live 2026-11-18: Carpso delivered).
ENV = "production"
AT_USERNAME = "ChurchOnApp"                        # AT app: ChurchOnApp (funded)
AT_FROM = "Carpso"                                 # approved sender ID — DropOff SMS
# Cross-wallet fallback (owner 2026-11-18: "one wallet — when one app's
# balance shows zero it uses the other app's balance"): if the ChurchOnApp
# send fails (key dead, wallet empty), sendSms retries on the fallback app's
# wallet via its DEFAULT route (kingdom_sponsor has no approved sender, so
# those SMS go out unbranded). Secret: AT_FALLBACK_API_KEY.
AT_FALLBACK_USERNAME = "kingdom_sponsor"           # funded ZMW 99.77 — emergency wallet
# Legacy SMS_* names still read as a fallback (sms.ts).

# CORS: comma-separated origins allowed to call the API cross-origin (the
# Flutter-web admin build). Empty = same-origin consoles only. e.g.
# CORS_ORIGINS = "https://admin.yourdomain.com"
CORS_ORIGINS = ""

[ai]
binding = "AI"

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "dropoff-backups"

# Realtime chat: one ChatRoom Durable Object per thread (hibernating WebSockets).
[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatRoom"

[[migrations]]
tag = "v1_chat_do"
new_sqlite_classes = ["ChatRoom"]

[[d1_databases]]
binding = "DB"
database_name = "dropoff-db"
database_id = "1100c702-d4c2-4114-8926-7e113350ad17"
migrations_dir = "migrations"

# Secrets (set with: npx wrangler secret put <NAME>)
#   LIPILA_API_KEY   - Lipila API key (sandbox key with sandbox base, live key with live base)
#   API_AUTH_KEY     - ops/rider-app service key (`X-Api-Key`)
#   ADMIN_AUTH_KEY   - superadmin pricebook/partner key (`X-Admin-Key`)
#   JWT_SECRET       - signs phone-OTP JWTs AND hashes OTP codes; set a long random string
#   SMS_USERNAME     - Africas Talking username (OTP delivery)
#   SMS_API_KEY      - Africas Talking API key
#   SMS_SENDER_ID    - approved sender name, e.g. "DropOff" (optional)
#   OWNER_PHONE      - 260XXXXXXXXX — receives intrusion / new-device alerts (security.ts)
#   OWNER_EMAIL      - email copy of owner alerts (falls back to SMS/push only)
#   HF_API_KEY       - Hugging Face Inference Providers token (optional, PAID).
#                      Used only when set, for AI calls if Workers AI ever lacks a
#                      model. PRIMARY AI is free Workers AI (LLaVA vision, Mistral text).
#                      Note: this account returned HTTP 402 (no credits) — HF calls
#                      will no-op (fallback to free Workers AI).
# EMAIL BINDING: no secrets needed — transactional mail goes through `send_email`.
#
# FIRST-TIME SETUP:
#   1. npx wrangler d1 create dropoff-db   -> paste database_id here
#   2. npx wrangler d1 migrations apply dropoff-db --remote
#   3. npx wrangler deploy
#   4. Seed chargebook with X-Admin-Key: POST /admin/couriers, POST /admin/quotes
#   5. Go-live checklist:
#      - LIPILA_BASE_URL -> https://blz.lipila.io + live secret key
#      - Payout destinations need NO registration (riders and the platform momo
#        main number only receive). Confirm disbursements succeed from the live
#        pool; on failure the Lipila error text is logged and surfaced to ops.
#      - npx wrangler email sending enable <domain verified in this account>
#      - AUTH_DEV_MODE stays "0" once SMS secrets are in
# HUGGINGFACE_TOKEN - optional free HF inference fallback (mistralai/Mistral-7B-Instruct-v0.3); set with: npx wrangler secret put HUGGINGFACE_TOKEN
